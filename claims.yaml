  - id: QGATE-013
    title: "THE BORN-RELAXATION TEST: SUBSTANTIAL, CONTROLLED, INCOMPLETE -- TWO BARS MISSED AND KEPT (Modeled) -- the Valentini test on the corpus's guidance flow: does rho = uniform relax toward |Psi|^2? THE FAILURE HISTORY KEPT: the PDE upwind-advection scheme on a 120x120 grid produced H rising (0.82 to 7.2, wrong direction) with a control at 6.8 -- diagnosed as numerical, the node-singularities of the velocity field being what drives relaxation AND what kills the PDE scheme; the particle method that QGATE-011 proved works was substituted; THE RESULT (particle method, N=8000, 16-mode 2D box): H drops from 0.617 to 0.039, a 94 percent fall (bar: >30%, PASSED), single-mode control H=0.040 (bar: <0.15, PASSED) -- the relaxation is real, not numerical diffusion; STILL INCOMPLETE: H floor ~ 0.04 consistent with the sampling noise floor (sqrt(1/N) per cell, ~Nb^2 cells) -- two interpretations, (a) full relaxation within measurement resolution or (b) genuine plateau, the trend (t=2,3,4: H=0.061,0.047,0.039, decreasing but slowly) not discriminating; TWO BARS MISSED AND KEPT: (i) H_final < H_noise not achieved because the noise floor was not measured before the bar was set (Catch-28 filed); (ii) L1 distance at readout 0.69 raw / 0.54 floor-corrected vs bar 0.5, missed; THE M-SCALING TEST (the natural continuation with physics on both tines): run M=6,8,10,12 modes and ask whether H_floor scales as 1/sqrt(N) (noise-limited = full relaxation) or approaches a finite residue as M grows (= genuine partial relaxation = a new observable)"
    status: Modeled
    paper: null
    benchmark: benchmarks/qgate/born_relaxation.py
    depends_on: [QGATE-012, QGATE-011, QB-005]
    note: "The Born-relaxation question is the last computable brick on the nonlocal branch before the derivation-proper (which requires a rope model of Psi's dynamics, unbuilt), and it returned the most honest verdict the test could return: something is happening, the bars are partially honored and partially missed, and the reason the bars were missed is itself a physics result. THE PDE FAILURE IS LOAD-BEARING: the velocity field is singular at Psi-nodes, and a numerical scheme that cannot survive those singularities cannot measure relaxation. This is not a discretization artifact -- the singularities are the mechanism. The particle method that avoids them by construction (trajectories cross nodes one at a time, with the velocity sign-flipping) shows genuine H-decrease, which means the REAL relaxation signal was hidden behind the PDE's inability to handle the nodes, not absent from the physics. WHAT THE 94 PERCENT DROP ESTABLISHES: Born equilibrium is APPROACHED. What the incomplete floor leaves open: whether it is ATTAINED in the long run, or whether a finite residue persists, encoding genuine non-Born physics. The M-scaling test is the discriminator -- not a curiosity but a fork with physics on both tines. If H_floor ~ 1/sqrt(N) for all M (noise-limited), the corpus can responsibly report Born equilibrium demonstrated; if H_floor grows with M at fixed N (genuine partial relaxation), the corpus has discovered a new observable and the fifth pilot-wave condition is NOT fully satisfied by the minimal extension alone. Either result advances the branch more than a clean pass would have. THE TWO MISSED BARS, both registered: (i) the Catch-28 (bar set without measuring the noise floor -- methodological lesson, filed as a standing rule for all future H-function tests: measure the floor first); (ii) the L1 miss (0.54 vs 0.50 after floor correction: a residue at this scale is neither negligible nor damning, it is the question the M-scaling test exists to answer). NAMED NEXT-ORDERS: the M-scaling test (M=6,8,10 modes; the campaign's remaining computable question on this branch); cut v2.3.8 (four claims now, this being the honest shadow of 012's headline); and the electron model, patient as the nonlocal branch itself. [REGISTRY REPAIR 2026-07-29: a duplicate QGATE-013 from a double registration pass was excised; the duplicate's distinct findings are preserved -- its heavy-pointer variant showed H rebounding 0.330 -> 0.342 -> 0.399 (plateau/quasi-recurrence at 16 modes), recorded here and in the CHANGELOG, and its commissioned M-scaling test was executed as QGATE-015.]"


