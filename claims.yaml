    note: "Advanced from Open. FRAMING: FND-REL-002 (no material velocity) closes the CONVECTIVE/first-order-in-v preferred-frame channel -- the aether-wind kind Michelson-Morley ruled out. The residual worry is the DISPERSIVE channel: a discrete rope lattice has a rest frame, in principle a preferred frame (FND-REL-003). NEW RESULT (benchmarks/em/matter_lorentz_inaccessibility.py): that frame is provably inaccessible to every probe available below the lattice scale, via TWO independent suppressions -- (1) dispersion signal ~ (ka)^2 [wavelength must approach the lattice spacing]; and (2) NEW: a localized defect (atom) of width w couples to the discrete lattice (Peierls-Nabarro/umklapp odometer that could read absolute lattice motion) only as exp(-pi^2 w/a) -- EXPONENTIALLY suppressed, far stronger than the power-law dispersion term and not identified in FND-REL-003. STRESS-TESTED: tried to build a non-wave probe that sees the frame (direct lattice odometer; mutual-rest defect synchronization) -- both fail (odometer exp-killed; synchronization gives the RELATIVISTIC frame via Einstein sync, not the lattice frame). So no operational procedure recovers the frame. This UPGRADES FND-REL-003's survivable-if-a-is-small (an assumption) to provably-inaccessible-by-any-sub-lattice-probe (an argument). HONEST BOUNDARY (not overclaimed): this is EMERGENT Lorentz (exact below the cutoff), NOT fundamental -- the lattice frame still EXISTS in principle and the (ka)^2 dispersion is a real, falsifiable signature; and channel (2) assumes wide (composite/atomic) defects, so it does not cover hypothetical lattice-scale fundamental excitations. Status EFT-constrained: the matter sector is now on the same footing as the best emergent-Lorentz condensed-matter/lattice-QFT models, ARGUED rather than assumed, without pretending the preferred frame was abolished. Remaining open piece: whether the discreteness itself is removable (fundamental Lorentz) -- likely not, and shared with all lattice