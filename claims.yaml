    note: "The registry's cleanest example yet of a tool judged by a controlled experiment -- because for once the answer key existed: the plat 4_1's deep basin at 21.6 was already reachable by another road, so the mover's task was defined to the decimal, and its shortfall is a MEASUREMENT rather than a suspicion. THE SAFETY RESULT deserves to be called what it is: a Monte Carlo that swings sub-arcs through full pi-rotations at sixty percent inflation, thousands of times, without once corrupting topology -- because every state that matters is certified and every break is rolled back -- is the rearrangement infrastructure the era has needed since the first jam, and it is now permanent equipment regardless of which move class eventually wins. THE SHORTFALL'S SHAPE is the scientific content: acceptance was healthy, clearance was open, the shaking was vigorous -- and the deep basin stayed unreached, which localizes the failure precisely in the MOVE CLASS: crossing this boundary requires a coordinated global passage (a strand sliding AROUND a lobe) that has essentially zero probability as a composition of local arc rotations. That is not a tuning problem; it is a topology-of-configuration-space fact, and it points with one finger at reptation -- material flow through the tube, the move that tight physical knots actually use, requiring no clearance at all. THE THREE FILED LESSONS (banking, dashboards, descent budget) are transferable to every stochastic instrument the corpus will ever build. And the benchmark carries the era's favorite trick: the boundary itself is ASSERTED, so the day a reptation mover crosses 22.5, the test suite will announce it. NAMED NEXT-ORDERS: the reptation mover (certifier-gated material flow); the 8_1 seat; the 7-crossing torus family; cut v2.3.3 when the arc rounds; and lambda, the axis, outlasting every mover. [THE BOUNDARY ANNOUNCED FALLEN at FND-MATTER-025: the reptation conveyor -- exactly the move class this claim's failure data specified 