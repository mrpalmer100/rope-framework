cture itself remains a conjecture, now cornered to one precisely-specified limb (instantaneous constraint propagation along inextensible strands in the CMB-adjacent mesh frame) with a quantified mechanical demand (K_L/K_T >= 1.9e8) and no remaining middle ground. The CHSH boundary remains unchanged above all of it. WHAT WOULD MOVE THIS: any derivation of the actual strand stiffness ratio (blocked with the mesh scale, FND-MATTER-003); any observed Bell-timing violation (would resurrect finite-v and falsify standard QM simultaneously); or a demonstration that instantaneous constraint propagation in the mesh produces the g2 ~ 0 anticorrelation quantitatively -- the last being the conjecture's real test and nobody's result yet. [THE NAMED TEST EXECUTED: QB-009's conservation toy demonstrates the limb SUFFICES -- g2 = 0.000 derived from bookkeeping (vs 0.998 with the budget off on identical draws), Born upgraded to the exact per-quantum law, no-signaling marginals, CHSH still failing at S = 1.42. Sufficiency shown; truth not; status here unchanged.]"

