    title: "THE LAMBDA GATE: ANATOMY, AUDIT, AND THE CONDITIONAL (Modeled) -- the axis finally gets what FND-MATTER-003 gave the atomic scale, a precise anatomy of what is missing plus an instrument converting hypotheses into numbers: THE AUDIT -- the bend-law constants (a = -0.509658, b = 2pi(5/2 - 7sqrt2/4), analytically derived) and the contact constant (dE = -0.502506 per site, units sqrt(kt/mu)) descend from the SAME minus-chain lattice with the same normalization, therefore S HAS NO INTERNAL FREEDOM and the gate is exactly ONE number with anatomy lambda = E_mode/(T.D), the ratio of the lattice mode-energy scale to the rope's tension-energy per diameter -- one dimensionless microphysical ratio, its derivation needing T and kt from one microstructure, NAMED like a and N before it; THE CONDITIONAL (hypothesis-shaped, NOT an identification): with source-grade doublet geometry (granny 28.520 D, square 28.535 D, split 0.05 percent) and matched-configuration ledgers (the square 5.7 percent MORE contact-bound), the trajectory m(lambda) = L + lambda.S gives doublet degeneracy at lambda ~ 0.008-0.010, the n/p ratio 1.00138 at lambda* ~ 0.029-0.035 with granny heavier, masses positive, corrections ~3 percent, and the coarse spectrum barely moving (m_41/m_31 shifts 0.16-0.2 percent): GEOMETRY SETS COARSE RATIOS, CONDITIONING SETS FINE SPLITTINGS; THE SIGN FACT lambda-independent: because the geometric split UNDERSHOOTS the target, the condition requires the more-bound member to become the LIGHTER one -- exactly how binding energy behaves; the hypothesis could have demanded the unphysical sign and demands the physical one; lambda remains UNDERIVED and is said so -- what changed is that the gate now has an anatomy, an audit certifying one-parameterhood, and a conditional map from hypotheses to falsifiable spectra"
