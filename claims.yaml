    depends_on: [GRV-025, GRV-029, GRV-034, GRV-038]
    note: "The gate on the whole arc, and it opened with a reframing rather than a rescue. THE FEAR, as it stood for fourteen claims: the dictionary was derived at weak field and the horizon is strong field -- an extrapolation, flagged at full volume in every claim and both papers. THE AUDIT'S CENTRAL MOVE: identify what 'strong field' actually means for an induced action. The potential Phi/c^2 is O(1) at the horizon -- but no correction term in a Sakharov series couples to the potential; corrections couple to CURVATURE INVARIANTS times the lattice scale, and the horizon of a large black hole is one of the mildest-curvature environments in which interesting physics happens: eps = 1e-78. The metric components' dramatic behavior (g00 -> 0) is a coordinate-conspicuous, invariant-quiet phenomenon -- which is, in retrospect, exactly what the frozen-star reading always said: the drama at the horizon is about TIME, not about curvature. THE EXACTNESS LEMMA is the audit's teeth: it would not have been enough for Ricci corrections to be small; on vacuum Schwarzschild they VANISH, because the solution is Ricci-flat -- so the two leading correction classes in any induced series do not shift the horizon at all, and the sole survivor (Weyl-squared) is bounded by the mildness theorem. THE DICTIONARY CHECK closes the last operational worry: GRV-029's verification was perturbative, and a dictionary valid only in linearization would poison every profile the arc reads; at ten-fold conditioning the pointwise reading holds at two percent, including in the dip. THE UPGRADE EXECUTED ACROSS THE ARC: the shared caveat is revised from 'weak-field-derived, extrapolated, unexamined' to 'audited: a controlled expansion with corrections bounded at 1e-78 at the horizon and shell, Ricci-class corrections vanishing exactly, residual premises named.' Fourteen claims breathe easier tonight; none of them changes a digit. THE HONEST REMAINDER, kept sharp: the generic-series premise (the q^2 derivation's completion assumed EFT-standard -- deriving the actual coefficient of Weyl-squared from the weave is a real open computation); the sub-r_break interior (a region the size of nothing, but a region); and the 1+1 scope of A3. NAMED NEXT-ORDERS: the Weyl-squared coefficient from the weave band (would convert the premise to a measurement); the 3D dictionary check; the reabsorption bookkeeping from GRV-047."

  - id: FND-REL-001
