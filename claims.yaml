conjectures died at named tests and the third was never filed -- the caution is now a theorem's worth of vindication. (2) The polynomial hierarchy converges to the unrestricted ceiling 3; the odd-order ladder's deceleration was the 1/degree cost of approximating kinks, and the parity structure (QB-017) was its fine print. (3) THE HARMONIC-ORDER CLAUSE IS STRUCK from the wall specification: what survives is T1 (non-propagating, identity-class), T2 (setting-inclusive), T3 (spherical ensemble; ceiling 3 exact). The crossing order is bracketed: > 5 (QB-017's rung) and <= ~75 (this construction's per-vector order); tightening the bracket is available but no longer foundational. (4) THE HONEST NEGATIVE THAT IS THE REAL FINDING: 2.88 is SUPRA-QUANTUM -- this class contains no-signalling correlations BEYOND quantum mechanics (capped at 3, sub-PR), so nothing here explains why nature sits at 2 sqrt 2; rather, the last structural suspect (smoothness/order) is ELIMINATED, and the question is isolated with unprecedented cleanness: the gamma = 1 marginals + no-signalling admit [0, 3]; classical local realism selects [0, 2]; nature selects [0, 2 sqrt 2]; and WHAT PRINCIPLE CUTS 3 DOWN TO 2 sqrt 2 is now the wall, whole and entire, with every decoy stripped away. NAMED NEXT-ORDERS: the Tsirelson-selection question itself (candidate: a quantum-side constraint the corpus's gamma-law derivation might already contain -- the Hopf/spinor structure that PRODUCED gamma = 1 may cap the conditional class it admits); and the minimal-crossing-order bracket tightening (secondary). [ANSWERED: QB-019 -- mechanism-unity (Gram/TLM) selects Tsirelson from [0,3]; this claim's crossing object is the star witness, violating TLM by 0.739 (per-pair choices inconsistent with any single response mechanism); the quantum point saturates TLM exactly; the wall's import downgrades to one sentence: the mechanism is one thing.]"

