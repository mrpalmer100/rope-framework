ecification's fifth clause updates from 'l >= 2' through 'nonpolynomial (conjectured)' to the measured 'l >= 4 or nonpolynomial', with the conjecture's stronger form dead. CAVEATS STATED: sampled-LP values are upper estimates decreasing under densification; the numeric mean map carries ~3 percent regression residual (ceiling uncertainty ~ +-0.05); both findings (freed B, supra-classical crossing) sit far outside these tolerances. WHAT THE LADDER NOW TEACHES: the wall's fine structure is real and non-monotone in character -- even content buys weak gains, odd content buys classicality-crossing strength, and the gap to quantum narrows rung by rung (0.94, 1.20, 2.27 toward 3) with Tsirelson as an interior point the polynomial hierarchy approaches from below. NAMED NEXT-ORDER: the quartic rung (does l <= 4 cross Tsirelson? -- if yes, the specification's order clause terminates at 4; if the rung lands in (2.27, 2.83), the approach continues and the minimal quantum-reaching order climbs), and the analytic question of WHY the forcing families lose their grip exactly at degree 3. [PLATEAU FOUND: QB-016's quartic rung adds nothing -- odd sector saturated at the identical (B,D) optimum, ceiling flat at ~2.27, Tsirelson decisively not crossed; the ladder plateaus below quantum and the clause hardens toward nonpolynomial outright (the plateau conjecture).]"

