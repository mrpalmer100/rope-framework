ame instantaneous-influence account reproducing single-quantum statistics) -- the known viability of that territory is an existence proof, and the rope framework's distinctive burden is deriving such guidance FROM mesh mechanics rather than postulating it; the formal adjacency registration is the named next step. WHAT WOULD ADVANCE THIS: extending the budget to CORRELATED two-particle emission (whether any mesh-native shared-budget structure can push S past 2 without importing the wavefunction) -- the precise question on which the entire quantum boundary now hangs. [ADJACENCY REGISTERED: QB-010 anchors the limb to de Broglie-Bohm (existence proof, priority Bohm's) and machine-localizes the remaining gap -- the identical race gives S = 1.418 in physical space vs 2.833 on configuration space: the summit question is whether config-space guidance can emerge from mesh mechanics. Arc closed at its planned stop.]"

  - id: QB-010
