ivisibility (dBB postulates point particles and has no account of why quanta are indivisible; QB-007a derives all-or-nothing from integer topology), an independently-motivated preferred foliation (relativistic dBB requires one and leaves it unexplained; the mesh frame is CMB-adjacent with independent physical content and a quantified mechanical demand, K_L/K_T >= 1.9e8, QB-008), and the contamination-structure match of the measured g2 (QB-009). ARC STATUS: with this registration the quantum-measurement arc (QB-007 through QB-010) reaches its planned disciplined stop -- decomposed, bounded, cornered, demonstrated sufficient, and positioned -- with one summit question stated precisely and its difficulty honestly benchmarked against the field's own unsolved reconstruction problem. Further assault on the summit is deferred in favor of the registered higher-yield priorities (nuclear mode-capacity rebuild; chemistry tail-asymmetry charges; Lean formalization). [ANGLE IDENTIFICATION CLOSED: QB-011 fixes gamma = 1 by structure (energy is fibre-blind and base-cosine-linear), consistency (relabeling forces gamma odd), and dynamics (p/2 = 0.87); the construction's imported ingredient is now exactly and only this conditional.] [WALL CHARACTERIZED: QB-012 converts the localized import into a four-clause specification -- non-propagating, setting-inclusive, spherical-ensemble, ceiling 3 -- with the planar no-go (4-4/pi < Tsirelson) and PR excluded by the detection law.]"

