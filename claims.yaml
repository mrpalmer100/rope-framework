  - id: QGATE-011
    title: "THE NONLOCAL BRANCH OPENED: THE MISSING DYNAMICS NAMED, DEFINED, PRICED, AND DEMONSTRATED IN MINIMAL FORM (Modeled) -- the branch the ledger said was missing 'a kind of dynamics' now has the kind specified: THE INVENTORY -- the registry already owns the KINEMATICS of quantum correlations (Hilbert-shaped response objects in the Hopf-native quaternion algebra QB-011/020, native interference QB-005, indivisible detection from integer topology QB-007a, Tsirelson as a theorem with the native singlet saturating it QB-019/020/021, and QB-006's four-of-five pilot-wave conditions); THE DEFINITION -- a GUIDANCE FLOW v(q_1..q_N; Psi) on joint configuration space with (D1) JOINT DEPENDENCE (Bell-forced by QB-006's theorem: not factorizable through local 3-space fields), (D2) EQUIVARIANCE (the flow transports |Psi|^2 by continuity -- QB-006's missing fifth condition stated as a PDE), (D3) statistical no-signaling; THE UNIQUENESS -- in 1D continuity determines v = j/rho EXACTLY, the corpus's own current structure forcing the de Broglie guidance form in the minimal case; THE DEMONSTRATION -- 3000 trajectories sampled from |Psi(0)|^2 and guided by v = j/rho track |Psi(T)|^2 through two-mode interference while a plausible LOCAL flow misses the fringes entirely (~15x L1 contrast: equivariance is a REAL constraint, not decoration); THE PRICE LIST -- (i) Psi as a real field on joint configuration space + guidance = THE MINIMAL EXTENSION consistent with every corpus commitment, cost one new entity that is not a 3-space rope object (the ontology becomes dualist, priced not smuggled); (ii) Psi-in-local-3-space-fields FORBIDDEN (theorem-forced); (iii) superdeterminism/retrocausality declined (no machinery, measurement independence abandoned); (iv) many-worlds-type declined (single-outcome realism abandoned); THE BRANCH JOINT named -- guidance needs no hbar, the phase-to-action normalization S/hbar being where the nonlocal and scale branches meet"
    status: Modeled
    paper: null
    benchmark: benchmarks/qgate/guidance_flow.py
    depends_on: [QB-006, QB-020, QB-005, QGATE-008]
    note: "The branch that spent the whole campaign being called 'the deeper half' turns out, on opening, to be SHALLOWER than advertised in one precise sense: the corpus is not missing quantum mechanics -- it is missing ONE FLOW. Everything else (the Hilbert-shaped response algebra, the Tsirelson cap, the singlet, indivisible events, interference) was already derived or constructed, mostly by campaigns that did not know they were building pilot-wave kinematics. QB-006 (Mark's own reframing) had counted four of five necessary conditions; tonight formalized the fifth as a PDE, proved its 1D uniqueness from the corpus's own current structure, and watched 3000 trajectories thread interference fringes correctly under it while a reasonable local rule scattered 15x wide. THE PRICE LIST IS THE CLAIM'S SPINE: the framework's ontology -- everything is rope in 3-space -- CANNOT survive this branch intact, and the four exits are now priced rather than blurred: the minimal one costs a dualist ontology (a real Psi on configuration space, guiding), the local one is theorem-dead, and the other two abandon commitments the framework holds deeper than 3-space monism. Registering that the CHEAPEST honest exit still costs the ontology its purity is exactly the kind of self-knowledge the registry exists to hold. THE SYMMETRY WITH THE SCALE BRANCH is now visible and lovely: each branch terminates in ONE named object (a width/Sigma there, a flow here), each object carries ONE named cost (a neutron-star vacuum there, a dualist ontology here), and the two meet at exactly one seam (S/hbar). NAMED NEXT-ORDERS: the equivariance question in the corpus's native variables (does the Hopf machinery's current define j on TANGLE configuration space -- the step from demonstration to derivation); the Born-equilibrium relaxation question (Valentini-style: does the rope substrate's coarse dynamics relax rho -> |Psi|^2); the two-particle demonstration (guidance reproducing the QB-020 singlet correlations end to end); and the rope electron model, still holding its acceptance test, now joined by a second commission from this branch: the electron's guidance behavior."

  - id: QGATE-012
    title: "THE TWO-PARTICLE SINGLET UNDER GUIDANCE: THE CORPUS'S FIRST DYNAMICAL BELL VIOLATION (Modeled) -- the marriage of QB-020's kinematics (the corpus-native singlet) and QGATE-011's flow, run end to end as a full Bell experiment: two Stern-Gerlach pointer coordinates, the singlet amplitudes carrying the correlations, trajectories guided by the JOINT two-particle Psi, outcomes = sign(position), no collapse, no formula evaluation: RESULT -- CHSH S = 2.724, decisively above the local cap 2.000 that QB-003/006 proved unbreachable for every local mechanism, within ~4 percent of Tsirelson (residual = finite 5-sigma packet separation + MC noise); marginals 0.487-0.517 across all remote settings, NO-SIGNALING VERIFIED EMPIRICALLY; the nonlocal probe showing |dv1| = 0.949 for a y2 shift during overlap vs 0.025 after separation, a 38x ratio -- D1's joint dependence switching on and off exactly where pilot-wave dynamics requires; KEPT FAILURE, the first run -- with a light pointer the packets SPREAD faster than they separated (CHSH 1.27, marginals 0.28), the bars catching a bad pointer, the lesson (heavy pointer, fine integration near nodes) filed; HONEST PROVENANCE -- Psi is the textbook two-qubit-pointer wavefunction, the corpus-native content being the singlet's construction and the flow's definition: this demonstrates the priced minimal extension WORKS, not that the substrate produces it -- deriving Psi's dynamics FROM the rope medium remains the open mountain"
