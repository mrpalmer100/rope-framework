<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1180" viewBox="0 0 1240 1180">
<defs>
<marker id="ar" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
<path d="M0,0 L6,3 L0,6 Z" fill="#2E5A88"/></marker>
<marker id="arg" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
<path d="M0,0 L6,3 L0,6 Z" fill="#4a7c3f"/></marker>
<linearGradient id="der" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#EAF1F8"/><stop offset="100%" stop-color="#D6E4F2"/></linearGradient>
<linearGradient id="blind" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#EAF3E8"/><stop offset="100%" stop-color="#D4E7CF"/></linearGradient>
<linearGradient id="res" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#FBEEE6"/><stop offset="100%" stop-color="#F6E0D0"/></linearGradient>
</defs>
<rect width="1240" height="1180" fill="white"/>
<text x="620" y="46" font-family="Calibri,Arial" font-size="27" font-weight="bold" fill="#1F3864" text-anchor="middle">How 1/α Was Derived</text>
<text x="620" y="74" font-family="Calibri,Arial" font-size="15" fill="#595959" text-anchor="middle">Every factor of the fine-structure constant, and the theorem that produced it</text>
<rect x="420" y="100" width="400" height="70" rx="12" fill="#1F3864"/><text x="620" y="132" font-family="Calibri,Arial" font-size="26" font-weight="bold" fill="white" text-anchor="middle">1/α = 4 π³ × D_E</text><text x="620" y="156" font-family="Calibri,Arial" font-size="14" fill="#c9d6e8" text-anchor="middle">= 137.060504   (measured: 137.035999,  +178.8 ppm)</text><rect x="140" y="200" width="520" height="82" rx="10" fill="url(#blind)" stroke="#4a7c3f" stroke-width="1.8"/><text x="162" y="230" font-family="Calibri,Arial" font-size="20" font-weight="bold" fill="#1a1a1a">D_E = 1.1051029</text><text x="162" y="250" font-family="Calibri,Arial" font-size="13" font-style="italic" fill="#555">the electron dressing</text><line x1="660" y1="241" x2="678" y2="241" stroke="#4a7c3f" stroke-width="2" marker-end="url(#arg)"/><text x="686" y="222" font-family="Calibri,Arial" font-size="12.5" font-weight="bold" fill="#4a7c3f">Commission W — computed BLIND</text><text x="686" y="240" font-family="Calibri,Arial" font-size="11" fill="#444">EL-BVP solver on the rotating winding</text><text x="686" y="255" font-family="Calibri,Arial" font-size="11" fill="#444">terminus; 5 configs, 7-digit agreement, gate</text><text x="686" y="270" font-family="Calibri,Arial" font-size="11" fill="#444">PASS. Computed before any comparison to α.</text><rect x="140" y="300" width="520" height="82" rx="10" fill="url(#der)" stroke="#2E5A88" stroke-width="1.8"/><text x="162" y="330" font-family="Calibri,Arial" font-size="20" font-weight="bold" fill="#1a1a1a">× 4</text><text x="162" y="350" font-family="Calibri,Arial" font-size="13" font-style="italic" fill="#555">rectified two-component sampling</text><line x1="660" y1="341" x2="678" y2="341" stroke="#2E5A88" stroke-width="2" marker-end="url(#ar)"/><text x="686" y="322" font-family="Calibri,Arial" font-size="12.5" font-weight="bold" fill="#2E5A88">Gate 2 (LINEAR) + Gate 1 rectification theorem</text><text x="686" y="340" font-family="Calibri,Arial" font-size="11" fill="#444">The charge coupling is force-type (degree-1</text><text x="686" y="355" font-family="Calibri,Arial" font-size="11" fill="#444">tether load, EM-013/EM-015). A first-power</text><text x="686" y="370" font-family="Calibri,Arial" font-size="11" fill="#444">rotating sampling has zero smooth mean, so</text><line x1="126" y1="300" x2="126" y2="282" stroke="#bbb" stroke-width="1.4"/><rect x="140" y="400" width="520" height="82" rx="10" fill="url(#der)" stroke="#2E5A88" stroke-width="1.8"/><text x="162" y="430" font-family="Calibri,Arial" font-size="20" font-weight="bold" fill="#1a1a1a">× π</text><text x="162" y="450" font-family="Calibri,Arial" font-size="13" font-style="italic" fill="#555">the J0 anchor conversion</text><line x1="660" y1="441" x2="678" y2="441" stroke="#2E5A88" stroke-width="2" marker-end="url(#ar)"/><text x="686" y="422" font-family="Calibri,Arial" font-size="12.5" font-weight="bold" fill="#2E5A88">Gate 1 (CLOSED) — κ = π/4 forced</text><text x="686" y="440" font-family="Calibri,Arial" font-size="11" fill="#444">The occupancy freeze I = E/ω = m·J0</text><text x="686" y="455" font-family="Calibri,Arial" font-size="11" fill="#444">(Commission O) forces the rectified</text><text x="686" y="470" font-family="Calibri,Arial" font-size="11" fill="#444">recording; κ =</text><line x1="126" y1="400" x2="126" y2="382" stroke="#bbb" stroke-width="1.4"/><rect x="140" y="500" width="520" height="82" rx="10" fill="url(#der)" stroke="#2E5A88" stroke-width="1.8"/><text x="162" y="530" font-family="Calibri,Arial" font-size="20" font-weight="bold" fill="#1a1a1a">× π</text><text x="162" y="550" font-family="Calibri,Arial" font-size="13" font-style="italic" fill="#555">the target scale πλ̄_C</text><line x1="660" y1="541" x2="678" y2="541" stroke="#2E5A88" stroke-width="2" marker-end="url(#ar)"/><text x="686" y="522" font-family="Calibri,Arial" font-size="12.5" font-weight="bold" fill="#2E5A88">Commission E — audited clean</text><text x="686" y="540" font-family="Calibri,Arial" font-size="11" fill="#444">The confinement scale conversion through the</text><text x="686" y="555" font-family="Calibri,Arial" font-size="11" fill="#444">tension T0; a single conversion, no free</text><text x="686" y="570" font-family="Calibri,Arial" font-size="11" fill="#444">factor.</text><line x1="126" y1="500" x2="126" y2="482" stroke="#bbb" stroke-width="1.4"/><rect x="140" y="600" width="520" height="82" rx="10" fill="url(#der)" stroke="#2E5A88" stroke-width="1.8"/><text x="162" y="630" font-family="Calibri,Arial" font-size="20" font-weight="bold" fill="#1a1a1a">× π</text><text x="162" y="650" font-family="Calibri,Arial" font-size="13" font-style="italic" fill="#555">the U-closure geometry</text><line x1="660" y1="641" x2="678" y2="641" stroke="#2E5A88" stroke-width="2" marker-end="url(#ar)"/><text x="686" y="622" font-family="Calibri,Arial" font-size="12.5" font-weight="bold" fill="#2E5A88">Commissions U + T — two-constraint closure</text><text x="686" y="640" font-family="Calibri,Arial" font-size="11" fill="#444">R* = J/(π²·μ·q²·c), with ln x* = π² exact</text><text x="686" y="655" font-family="Calibri,Arial" font-size="11" fill="#444">(T's confinement anchor). The π² is clean</text><text x="686" y="670" font-family="Calibri,Arial" font-size="11" fill="#444">rotation-closure geometry.</text><line x1="126" y1="600" x2="126" y2="582" stroke="#bbb" stroke-width="1.4"/><line x1="126" y1="182" x2="126" y2="642" stroke="#bbb" stroke-width="1.4"/><line x1="126" y1="170" x2="126" y2="182" stroke="#2E5A88" stroke-width="2" marker-end="url(#ar)"/><text x="116" y="410" font-family="Calibri,Arial" font-size="12" fill="#888" text-anchor="middle" transform="rotate(-90 116 410)">multiplied together</text><rect x="380" y="706" width="480" height="66" rx="10" fill="url(#res)" stroke="#B5652E" stroke-width="1.8"/><text x="620" y="733" font-family="Calibri,Arial" font-size="16" font-weight="bold" fill="#7a3b12" text-anchor="middle">+178.8 ppm — the single open residual</text><text x="620" y="754" font-family="Calibri,Arial" font-size="12" fill="#7a3b12" text-anchor="middle">not derived; pinned against a construction with no continuous dials (scale-invariance theorem)</text><text x="620" y="800" font-family="Calibri,Arial" font-size="15" font-weight="bold" fill="#1F3864" text-anchor="middle">Three independent observables, one convention structure</text><rect x="330" y="824" width="580" height="38" rx="8" fill="#f4f7fa" stroke="#c9d6e8" stroke-width="1.2"/><text x="348" y="848" font-family="Calibri,Arial" font-size="13" font-weight="bold" fill="#2E5A88">Anchor J0</text><text x="510" y="848" font-family="Calibri,Arial" font-size="11.5" fill="#444">Gate 1: one formula hits two registered J0 targets (πα and ħ)</text><rect x="330" y="870" width="580" height="38" rx="8" fill="#f4f7fa" stroke="#c9d6e8" stroke-width="1.2"/><text x="348" y="894" font-family="Calibri,Arial" font-size="13" font-weight="bold" fill="#2E5A88">Magnetic moment g=2</text><text x="510" y="894" font-family="Calibri,Arial" font-size="11.5" fill="#444">Gate 2b: π (mechanical) × 1/π (recording) = Dirac g=2, out of sample; residual = Schwinger term α/2π</text><rect x="330" y="916" width="580" height="38" rx="8" fill="#f4f7fa" stroke="#c9d6e8" stroke-width="1.2"/><text x="348" y="940" font-family="Calibri,Arial" font-size="13" font-weight="bold" fill="#2E5A88">Atomic binding 13.6 eV</text><text x="510" y="940" font-family="Calibri,Arial" font-size="11.5" fill="#444">Gate 3: Rydberg at residual²; convention-count confirms the single 4/π lives in e²</text><text x="620" y="1010" font-family="Calibri,Arial" font-size="13" font-style="italic" fill="#595959" text-anchor="middle">Every factor is derived. The +178.8 ppm residual is the single unexplained number.</text><text x="620" y="1030" font-family="Calibri,Arial" font-size="13" font-style="italic" fill="#595959" text-anchor="middle">This reduces 1/α to one blind number times a derived prefactor — it is not a derivation of α’s value.</text><rect x="330" y="1070" width="16" height="16" rx="3" fill="url(#blind)" stroke="#4a7c3f" stroke-width="1.3"/><text x="352" y="1083" font-family="Calibri,Arial" font-size="12" fill="#333">Computed blind</text><rect x="490" y="1070" width="16" height="16" rx="3" fill="url(#der)" stroke="#2E5A88" stroke-width="1.3"/><text x="512" y="1083" font-family="Calibri,Arial" font-size="12" fill="#333">Derived from mechanics</text><rect x="720" y="1070" width="16" height="16" rx="3" fill="url(#res)" stroke="#B5652E" stroke-width="1.3"/><text x="742" y="1083" font-family="Calibri,Arial" font-size="12" fill="#333">Open residual</text></svg>