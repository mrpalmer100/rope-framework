7675664150662 455,140.94744111674234 458,143.6508138394973 461,147.06872444956556 464,151.0517938523324 467,155.42594280200925 470,159.99999999999997" fill="none" stroke="#B5651D" stroke-width="2.4"/><rect x="64" y="134" width="30" height="52" rx="4" fill="#EDE4D0" stroke="#7B2D26" stroke-width="2"/><text x="79" y="204" font-size="11" fill="#7B2D26" text-anchor="middle" font-weight="normal">battery</text><path d="M79,120 A16,16 0 1,1 80,120" fill="none" stroke="#1F5C5C" stroke-width="2.2" marker-end="url(#at)"/><text x="79" y="108" font-size="11" fill="#1F5C5C" text-anchor="middle" font-weight="normal">turn</text><circle cx="492" cy="160" r="17" fill="#EDE4D0" stroke="#B5651D" stroke-width="2"/><text x="492" y="200" font-size="11" fill="#B5651D" text-anchor="middle" font-weight="normal">load</text><path d="M492,126 A14,14 0 1,1 493,126" fill="none" stroke="#1F5C5C" stroke-width="2" marker-end="url(#at)"/><text x="492" y="114" font-size="11" fill="#1F5C5C" text-anchor="middle" font-weight="normal">turns</text><text x="300" y="250" font-size="11" fill="#666666" text-anchor="middle" font-weight="normal" font-style="italic">Turning a plain rod just spins it; turning a HELIX drives motion along it,</text><text x="300" y="266" font-size="11" fill="#666666" text-anchor="middle" font-weight="normal" font-style="italic">like a corkscrew or an Archimedes screw. Rotation and transport are one motion.</text><text x="300" y="290" font-size="10" fill="#8A97A8" text-anchor="middle" font-weight="normal" font-style="italic">(The turning runs down the rope as a very fast torsional wave — not rigid lockstep —</text><text x="300" y="304" font-size="10" fill="#8A97A8" text-anchor="middle" font-weight="normal" font-style="italic">which is why work actually reaches the load.)</text></svg>