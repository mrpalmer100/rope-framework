<svg xmlns="http://www.w3.org/2000/svg" width="600" height="340" viewBox="0 0 600 340" font-family="Georgia, serif"><defs><marker id="am" markerWidth="11" markerHeight="11" refX="8" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 Z" fill="#1F5C5C"/></marker></defs><rect width="600" height="340" fill="#FCFBF8"/><text x="300" y="32" font-size="19" fill="#1B3A5C" text-anchor="middle" font-weight="bold">Permanent magnet — aligned rope-swirls, no current</text><text x="300" y="53" font-size="12" fill="#666666" text-anchor="middle" font-weight="normal">each atom is a tiny swirl; lined up, billions of them make one big circulation</text><rect x="180" y="150" width="240" height="60" rx="4" fill="#EDE4D0" stroke="#7B2D26" stroke-width="2"/><path d="M217,171.0 A11,11 0 1,1 199,171.0" fill="none" stroke="#1B3A5C" stroke-width="1.8" marker-end="url(#am)"/><path d="M263,171.0 A11,11 0 1,1 245,171.0" fill="none" stroke="#1B3A5C" stroke-width="1.8" marker-end="url(#am)"/><path d="M309,171.0 A11,11 0 1,1 291,171.0" fill="none" stroke="#1B3A5C" stroke-width="1.8" marker-end="url(#am)"/><path d="M355,171.0 A11,11 0 1,1 337,171.0" fill="none" stroke="#1B3A5C" stroke-width="1.8" marker-end="url(#am)"/><path d="M401,171.0 A11,11 0 1,1 383,171.0" fill="none" stroke="#1B3A5C" stroke-width="1.8" marker-end="url(#am)"/><text x="300" y="228" font-size="10" fill="#666666" text-anchor="middle" font-weight="normal" font-style="italic">aligned atomic swirls (same sense)</text><path d="M410,158 C 510,120 510,250 300.0,280" fill="none" stroke="#B5651D" stroke-width="2.4" marker-end="url(#am)"/><path d="M300.0,280 C 90,250 90,120 190,158" fill="none" stroke="#B5651D" stroke-width="2.4"/><path d="M190,148 C 270.0,116 330.0,116 410,148" fill="none" stroke="#B5651D" stroke-width="2.4" marker-end="url(#am)"/><text x="172" y="184.0" font-size="15" fill="#1B3A5C" text-anchor="end" font-weight="bold">S</text><text x="428" y="184.0" font-size="15" fill="#1B3A5C" text-anchor="start" font-weight="bold">N</text><text x="300" y="300" font-size="11" fill="#666666" text-anchor="middle" font-weight="normal" font-style="italic">No charge flows. A 'pole' is just which way the threads sweep at an end — the threads</text><text x="300" y="316" font-size="11" fill="#666666" text-anchor="middle" font-weight="normal" font-style="italic">enter one end and leave the other, so cutting the bar only makes two smaller whole magnets.</text></svg>