<svg xmlns="http://www.w3.org/2000/svg" width="600" height="330" viewBox="0 0 600 330" font-family="Georgia, serif"><defs><marker id="al" markerWidth="11" markerHeight="11" refX="8" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 Z" fill="#1F5C5C"/></marker></defs><rect width="600" height="330" fill="#FCFBF8"/><text x="300" y="34" font-size="19" fill="#1B3A5C" text-anchor="middle" font-weight="bold">Light — a transverse ripple racing down the rope</text><text x="300" y="55" font-size="12" fill="#666666" text-anchor="middle" font-weight="normal">a sideways flick that travels, the way a wave runs down a snapped jump rope</text><circle cx="70" cy="175" r="16" fill="#7B2D26" stroke="#1B3A5C" stroke-width="2"/><circle cx="530" cy="175" r="16" fill="#7B2D26" stroke="#1B3A5C" stroke-width="2"/><text x="70" y="209" font-size="11" fill="#1B3A5C" text-anchor="middle" font-weight="bold">atom</text><text x="530" y="209" font-size="11" fill="#1B3A5C" text-anchor="middle" font-weight="bold">atom</text><polyline points="88,175.0 91,175.0 94,175.0 97,175.0 100,175.0 103,175.0 106,175.0 109,175.0 112,175.0 115,175.0 118,175.0 121,175.0 124,175.0 127,175.0 130,175.0 133,175.0 136,175.0 139,175.0 142,175.0 145,175.0 148,175.0 151,175.0 154,175.0 157,175.0 160,175.0 163,175.0 166,175.0 169,175.0 172,175.0 175,175.0 178,175.1 181,175.1 184,175.2 187,175.3 190,175.4 193,175.5 196,175.8 199,176.0 202,176.3 205,176.7 208,177.0 211,177.4 214,177.6 217,177.8 220,177.7 223,177.3 226,176.5 229,175.2 232,173.4 235,171.0 238,168.1 241,164.6 244,160.8 247,156.9 250,152.9 253,149.1 256,145.9 259,143.3 262,141.7 265,141.0 268,141.5 271,142.9 274,145.4 277,148.5 280,152.3 283,156.3 286,160.4 289,164.4 292,168.0 295,171.1 298,173.6 301,175.6 304,177.0 307,177.9 310,178.3 313,178.4 316,178.2 319,177.9 322,177.5 325,177.1 328,176.7 331,176.3 334,176.0 337,175.7 340,175.5 343,175.3 346,175.2 349,175.1 352,175.1 355,175.0 358,175.0 361,175.0 364,175.0 367,175.0 370,175.0 373,175.0 376,175.0 379,175.0 382,175.0 385,175.0 388,175.0 391,175.0 394,175.0 397,175.0 400,175.0 403,175.0 406,175.0 409,175.0 412,175.0 415,175.0 418,175.0 421,175.0 424,175.0 427,175.0 430,175.0 433,175.0 436,175.0 439,175.0 442,175.0 445,175.0 448,175.0 451,175.0 454,175.0 457,175.0 460,175.0 463,175.0 466,175.0 469,175.0 472,175.0 475,175.0 478,175.0 481,175.0 484,175.0 487,175.0 490,175.0 493,175.0 496,175.0 499,175.0 502,175.0 505,175.0 508,175.0 511,175.0" fill="none" stroke="#1B3A5C" stroke-width="2.8"/><line x1="255" y1="123" x2="330" y2="123" stroke="#1F5C5C" stroke-width="2.4" marker-end="url(#al)"/><text x="292" y="117" font-size="11" fill="#1F5C5C" text-anchor="middle" font-weight="normal">travels at speed c</text><line x1="200" y1="175" x2="200" y2="143" stroke="#B5651D" stroke-width="1.6" stroke-dasharray="3 2"/><text x="214" y="159" font-size="10" fill="#B5651D" text-anchor="start" font-weight="normal" font-style="italic">sideways</text><text x="300" y="262" font-size="11" fill="#666666" text-anchor="middle" font-weight="normal" font-style="italic">The rope itself only moves side-to-side; the ripple — the light — is what travels along it,</text><text x="300" y="278" font-size="11" fill="#666666" text-anchor="middle" font-weight="normal" font-style="italic">from one atom to another. Its two sideways directions are the two polarisations of light.</text></svg>