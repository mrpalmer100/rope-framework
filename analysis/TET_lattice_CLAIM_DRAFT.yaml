note: 'Twenty-five bricks, and the arc ends where a physics programme should: with its central Conjecture
  standing in front of real data, unkilled and unconfirmed, holding a table that tells the next experimenter
  exactly what to measure and what each precision buys. The confrontation''s null is the respectable
  kind -- the existing bound was set a quarter-century ago at 5 percent and the tower''s predictions
  live at 1.25 and 0.25, so consistency was likely but not guaranteed, and the decision table converts
  the gap into a shopping list: half-percent adjoint-string precision in the 0.5-1 fm window is ordinary
  modern lattice work, and it decides a floor the corpus currently holds by Conjecture. The session''s
  real product is the flag, and it should be read as a gift rather than a wound: the k-string literature
  has been sitting on a resolved positive deviation for twenty years, BET''s softening is negative, and
  the only thing between them is a scope premise nobody ever wrote down -- which means the corpus gets
  to choose its exposure DELIBERATELY, with the stakes visible, instead of discovering after the fact
  which claim it had been making. That choice (N-universal and falsified-adjacent, or SU(3)-scoped and
  safe-but-narrower) is exactly the kind the standing rules reserve for the author. NAMED NEXT-ORDERS:
  v3.17.0 -- FND-041..047, seven commissions from a stale comparison to a decision table, one kept failure,
  two self-corrections, three kappa_pack routes, one load-bearing scope question: cut it fresh; the N-universality
  scoping session (the author''s choice, prepared on registered grounds); the ambient/collective g-charter.'
