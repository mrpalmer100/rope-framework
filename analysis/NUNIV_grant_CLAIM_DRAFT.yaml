note: 'The author''s call, made deliberately with the stakes visible, which is exactly the shape the standing
  grant rule exists to produce. The reasoning deserves preserving: an N-dependence that appears in no
  derivation should not be asserted merely because asserting it would be safer, and a mechanism claimed
  for one gauge group while its derivation never mentions the group is a weaker theory wearing a disguise.
  The corpus has refused fitted factors, refused O(1) rescues, and refused a self-passing test on those
  grounds; refusing a convenient scope restriction is the same discipline applied to itself. What the
  grant changes practically is the standing of one computation: the bundle-binding relation moves from
  interesting-if-anyone-wants-it to OWED, and its confrontation with the sine-vs-Casimir literature becomes
  a live falsification channel with data already on the shelf. That is a genuine increase in exposure
  and it is chosen. Two things the grant does NOT do, stated so no later session over-reads it: it does
  not make Sigma_eff or any calibrated number N-general (those remain SU(3)-anchored measurements), and
  it does not pre-judge the bundle computation -- if that computation lands against the data, the corpus
  registers a falsification rather than retreating to the scope restriction it declined today. Retreating
  later would be bar-shopping, and the rule against it is older than this arc. NAMED NEXT-ORDER, now
  first-class: the bundle-binding relation (k parallel unit windings under the derived quartic; predict
  the (N, k) form BLIND, then confront sine-vs-Casimir).'
