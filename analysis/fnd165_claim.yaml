  collapse relocated; "collapse location is grid-dependent" is a ONE-cell
  finding (FND-164); the refined grid separates two collapse cells the coarse
  grid made look alike. WHAT IS NOT: no artifact claim is made; beyond A2
  0.0055 the 4/3 collapse''s status at 54 is OPEN, and the registered 36-grid
  collapse''s refined-grid counterpart is the sharpest open question in the
  program. Results: analysis/GR54A_results.md; states analysis/gr54a_ckpt.pkl.
  Granted by the author 2026-09-05.'
