note: 'Charter analysis/GR54A_charter_LOCKED.md (locked before data; 20-point
  budget from the start; forms A-DISPLACED / A-ROBUST / A-ABSENT / A-REFUSED,
  with A-ABSENT explicitly NOT an artifact verdict, per the GR54 lesson).
  Protocol identical to FND-164 at cell 4/3: seed pair gated at 1.04e-9 /
  9.54e-10, fresh 144x54:arc:n2=4 pattern, 20 arc points at ds 0.08, all gated
