note: 'The charter the corpus''s own next-order named and an external reviewer independently sharpened,
  adopted with attribution and with the reviewer''s central methodological instruction written into the
  bars: the question is not "find a formula that gives the number" but "does any licensed collective property
  produce a stable scale" -- and the corpus has enough scar tissue (MATTER055''s chance-level hit, MATTER056''s
  refused O(1) rescue, ELEC-083''s vacuity caught in its own bars) to know the difference is everything.
  What is new here is machinery rather than physics: for the first time the target is SEALED behind a
  tool that refuses to reveal it until the mechanism classes and their scaling laws are hashed and frozen,
  so a landing cannot have been steered and a null cannot be quietly re-scoped. The charter''s most important
  clause is the one that makes failure valuable: FND-044 collapsed five questions into one, and that collapse
  is a CONSOLIDATION until the one has an answer -- if no locked class lands, the corpus learns that its
  compression bought bookkeeping, which is a finding worth the session and is registered as such rather
  than absorbed. Two scope guards on the face: the BKT class may not import the temperature the vacuum
  sector does not register, and no class may adopt a new primitive without the author''s grant. SEQUENCE
  (reviewer''s, as adjusted): SCALE-001; the nuclear residual classifier; the frame-dragging COUPLING-PROVENANCE
  audit -- reordered and reframed because GRV-071 already found four of five coefficients ABSENT from
  the registered action for structural reasons, so "derive the coefficient without fitting" is not currently
  runnable and the honest prior question is whether matter-to-rotation coupling can be derived or must
  be granted; and the Born joint-outcome gate. The lattice-precision push runs externally throughout.'
